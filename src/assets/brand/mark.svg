<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="afriyouth-mark-left" x1="20" y1="90" x2="95" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C723DF" />
      <stop offset="1" stop-color="#6A1FE0" />
    </linearGradient>
    <linearGradient id="afriyouth-mark-right" x1="180" y1="90" x2="105" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A0FE0" />
      <stop offset="1" stop-color="#0301FF" />
    </linearGradient>
  </defs>

  <!-- small diamond spike above the head -->
  <rect x="91" y="4" width="18" height="18" rx="4" fill="#4B18E0" transform="rotate(45 100 13)" />

  <!-- head -->
  <circle cx="100" cy="60" r="22" fill="#2E0FE0" />

  <!-- left arm: sweeps down-left to a point -->
  <path
    d="M100 58
       C 90 66, 60 78, 36 102
       C 20 117, 10 136, 14 156
       C 36 146, 58 150, 78 168
       C 90 179, 98 194, 100 210
       Z"
    fill="url(#afriyouth-mark-left)"
  />

  <!-- right arm: sweeps down-right to meet the left at a point -->
  <path
    d="M100 58
       C 110 66, 140 78, 164 102
       C 180 117, 190 136, 186 156
       C 164 146, 142 150, 122 168
       C 110 179, 102 194, 100 210
       Z"
    fill="url(#afriyouth-mark-right)"
  />
</svg>
